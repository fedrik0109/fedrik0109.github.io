<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BilikApp – Sual Cavab Oyunu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a1a5c;--bg2:#030818;--card:rgba(255,255,255,.1);--tx:#fff;--blue:#1e90ff;--red:#ef3b3b;--green:#37c23a;--yellow:#ffc928;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100%;font-family:Nunito,system-ui,sans-serif;font-weight:900;color:var(--tx);background:radial-gradient(ellipse at 50% 0,var(--bg1),var(--bg2) 75%);overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.stars{position:fixed;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff8,transparent),radial-gradient(2px 2px at 85% 60%,#fff8,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff8,transparent);animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.35}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;max-width:480px;margin:auto;text-align:center;overflow:hidden auto}
.scr.on{display:flex;animation:in .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{opacity:0;transform:scale(.8) translateY(30px)}}
.logo{width:min(66vw,290px);border-radius:26px;box-shadow:0 0 50px #1e90ff88;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(2deg)}}
h1{font-size:28px;margin:18px 0 6px;text-shadow:0 3px 0 #0006}
p{margin:0 0 18px;opacity:.85;font-size:16px}
.btn{font:inherit;color:#fff;border:0;border-radius:20px;padding:16px 30px;font-size:20px;background:linear-gradient(#ffd43b,#ff9f1a);color:#3a2300;box-shadow:0 6px 0 #b86b00,0 10px 24px #0006;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b86b00}
.pulse{animation:pu 1.2s infinite}
@keyframes pu{50%{transform:scale(1.08)}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:60;background:var(--card);border:0;color:#fff;font-size:20px;width:42px;height:42px;border-radius:50%}
#cd{font-size:120px;text-shadow:0 0 40px var(--yellow)}
.top{width:100%;display:flex;justify-content:space-between;font-size:18px;margin-bottom:10px}
.bar{width:100%;height:12px;background:#fff2;border-radius:9px;overflow:hidden;margin-bottom:20px}
#fill{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transform-origin:left}
.q{background:var(--card);border:2px solid #fff3;border-radius:22px;padding:22px 16px;font-size:23px;line-height:1.25;width:100%;margin-bottom:18px;backdrop-filter:blur(6px)}
.ans{width:100%;display:flex;flex-direction:column;gap:12px}
.a{font:inherit;color:#fff;border:0;border-radius:18px;padding:14px;font-size:19px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 5px 0 #0007;animation:up .45s backwards}
.a:nth-child(2){animation-delay:.08s}.a:nth-child(3){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.a b{background:#fff3;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.c0{background:var(--blue)}.c1{background:var(--red)}.c2{background:var(--green)}
.a.ok{background:#1fd655;animation:ok .5s}.a.no{background:#555;animation:sh .4s}
@keyframes ok{50%{transform:scale(1.07)}}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#combo{height:30px;color:var(--yellow);font-size:22px;margin-top:12px}
.rank{font-size:84px;color:var(--yellow);text-shadow:0 0 30px #ffc92899;line-height:1}
.poster{width:min(60vw,250px);border-radius:22px;margin:12px 0;box-shadow:0 0 40px #ffc92877;transition:transform .1s;touch-action:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.alt{background:linear-gradient(#4aa8ff,#1e6fe0);color:#fff;box-shadow:0 6px 0 #0d3f94,0 10px 24px #0006}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;bottom:-60px;font-style:normal;font-size:var(--s);opacity:.28;animation:rise var(--d) linear infinite;animation-delay:var(--w);left:var(--x);filter:drop-shadow(0 0 8px currentColor)}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.aur{position:fixed;inset:-20%;background:conic-gradient(from 0deg at 50% 60%,#1e90ff33,#ef3b3b22,#37c23a22,#ffc92822,#1e90ff33);filter:blur(60px);animation:spin 20s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:fixed;left:50%;top:45%;width:20px;height:20px;margin:-10px;border:4px solid #fff;border-radius:50%;pointer-events:none;z-index:40;animation:rg .9s ease-out forwards}
@keyframes rg{to{transform:scale(40);opacity:0}}
.flash{position:fixed;inset:0;z-index:45;pointer-events:none;animation:fh .5s forwards}
@keyframes fh{from{opacity:1}to{opacity:0}}
.shake{animation:sk .5s}
@keyframes sk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}}
.big{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:52px;z-index:55;pointer-events:none;text-shadow:0 0 30px currentColor,0 4px 0 #0008;animation:bg .9s forwards}
@keyframes bg{0%{transform:scale(.2) rotate(-12deg);opacity:0}30%{transform:scale(1.2) rotate(4deg);opacity:1}100%{transform:scale(1) translateY(-80px);opacity:0}}
.rays{position:absolute;width:480px;height:480px;background:repeating-conic-gradient(#ffc92855 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 12s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
.pw{position:relative;display:grid;place-items:center;margin:6px 0}
.pw .poster{position:relative;animation:fl 3.5s ease-in-out infinite}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fffa,transparent);transform:skewX(-20deg);animation:sh2 2.2s infinite}
@keyframes sh2{to{left:130%}}
.q{animation:flip .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-70deg)}}
.stars-r{font-size:38px;letter-spacing:4px;margin-bottom:8px}
.stars-r span{display:inline-block;animation:st .6s backwards}
@keyframes st{from{transform:scale(0) rotate(-180deg)}}
.logo{border-radius:0;box-shadow:none;width:min(84vw,380px);filter:drop-shadow(0 0 28px #1e90ff99)}
.dl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:60;height:42px;padding:0 16px;display:flex;align-items:center;border-radius:21px;background:linear-gradient(#ffd43b,#ff9f1a);color:#3a2300;font-size:15px;text-decoration:none;box-shadow:0 3px 0 #b86b00,0 6px 16px #0006;animation:pu 1.6s infinite}
#s3{padding:58px 14px 14px}
#s3 .rank{font-size:60px}
#s3 h1{font-size:19px;margin:6px 0}
#s3 .stars-r{font-size:30px;margin:0 0 6px}
.rays{width:330px;height:330px}
.poster{width:auto;max-width:56vw;max-height:27dvh}
.cta{flex:0 0 100%;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px}
.appicon{width:68px;height:68px;border-radius:18px;box-shadow:0 0 22px #1e90ffaa,0 4px 0 #0006;animation:fl 3s ease-in-out infinite}
#s3 .btn{padding:12px 18px;font-size:17px}
#s3 .cta .btn{font-size:18px}
.btn,.dl{background:linear-gradient(#ffe680,#f7b500 55%,#e09a00);color:#3a2300;box-shadow:0 6px 0 #a86f00,0 10px 24px #0006}
.dl{box-shadow:0 3px 0 #a86f00,0 6px 16px #0006}
.btn:active{box-shadow:0 1px 0 #a86f00}
.a,.c0,.c1,.c2{background:linear-gradient(#ffe680,#f7b500 55%,#e09a00);color:#3a2300;box-shadow:0 5px 0 #a86f00}
.a b{background:#0002}
.a.ok{background:linear-gradient(#5cf27f,#1fd655);color:#fff;box-shadow:0 5px 0 #0b7a2a}
.a.no{background:linear-gradient(#ff7b7b,#e02b2b);color:#fff;box-shadow:0 5px 0 #8a1515}
.pw{perspective:900px}
.p3{transform-style:preserve-3d;animation:sw 5s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotateY(-30deg) rotateX(6deg)}50%{transform:rotateY(30deg) rotateX(-4deg) translateY(-8px)}}
.phone{position:relative;transform-style:preserve-3d;transition:transform .1s;touch-action:none;height:min(40dvh,360px);aspect-ratio:.6;border-radius:26px;border:6px solid #15151a;background:#000;box-shadow:0 0 0 2px #ffd34d,0 0 45px #ffc928bb}
.phone::before,.phone::after{content:"";position:absolute;inset:-6px;border-radius:28px;background:#0c0c10;box-shadow:0 0 0 2px #c98f00}
.phone::before{transform:translateZ(-9px)}
.phone::after{transform:translateZ(-18px)}
.scrn{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:#0a1a5c}
.pbg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(14px) brightness(.8)}
.scrn .poster{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;animation:none;border-radius:0;box-shadow:none;margin:0}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,#fff5 47%,transparent 56%);animation:gl 3s linear infinite}
@keyframes gl{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.notch{position:absolute;top:5px;left:50%;width:32%;height:8px;margin-left:-16%;background:#000;border-radius:6px}
.rays{width:300px;height:300px}
</style>
</head>

<script>
const PLAY_URL = "https://play.google.com/store/apps/details?id=com.huseynoff.bilikapp"; // Google Play linkini bura yaz
const $ = s => document.querySelector(s);
let ac, muted = false;
const A = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; };
function tone(f, d = .15, type = 'sine', v = .2, t = 0, to) {
  if (muted) return; const a = A(), o = a.createOscillator(), g = a.createGain(), s = a.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, s); if (to) o.frequency.exponentialRampToValueAtTime(to, s + d);
  g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
  o.connect(g).connect(a.destination); o.start(s); o.stop(s + d + .02);
}
function noise(d = .5, f0 = 200, f1 = 4000, v = .15) {
  if (muted) return; const a = A(), n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = b; fl.type = 'bandpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(fl).connect(g).connect(a.destination); s.start();
}
const SFX = {
  tap: () => tone(660, .08, 'triangle', .2, 0, 990),
  pop: () => tone(500 + Math.random() * 600, .1, 'sine', .12, 0, 1400),
  whoosh: () => noise(.5),
  tick: () => tone(880, .07, 'square', .07),
  good: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .22, i * .07)),
  bad: () => { tone(220, .35, 'sawtooth', .16, 0, 80); },
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .28, 'triangle', .22, i * .11))
};

/* particles */
const cv = $('#fx'), cx = cv.getContext('2d'); let P = [];
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
size(); addEventListener('resize', size);
const COL = ['#1e90ff', '#ef3b3b', '#37c23a', '#ffc928', '#fff'];
function burst(x, y, n = 14, power = 5) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * power + 1;
    P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, l: 1, c: COL[i % 5], r: 3 + Math.random() * 5, star: Math.random() < .4 }); }
}
function rain(ms = 2500) { const t = setInterval(() => burst(Math.random() * innerWidth, -10, 4, 2), 60); setTimeout(() => clearInterval(t), ms); }
(function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  P = P.filter(p => p.l > 0);
  for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += .18; p.l -= .014; cx.globalAlpha = Math.max(p.l, 0); cx.fillStyle = p.c;
    if (p.star) { cx.font = p.r * 3 + 'px sans-serif'; cx.fillText('★', p.x, p.y); } else cx.fillRect(p.x, p.y, p.r, p.r); }
  requestAnimationFrame(loop);
})();
addEventListener('pointerdown', e => { burst(e.clientX, e.clientY, 10, 4); if (!e.target.closest('button,a')) SFX.pop(); });


const SYM = ['?', 'A', 'B', '✓', '★', '?', 'C', '💡'];
for (let i = 0; i < 18; i++) { const e = document.createElement('i'); e.textContent = SYM[i % 8];
  e.style.cssText = `--s:${24 + Math.random() * 40}px;--d:${9 + Math.random() * 10}s;--w:-${Math.random() * 15}s;--x:${Math.random() * 95}%;color:${COL[i % 4]}`; $('#bg').appendChild(e); }
const tmp = (cls, st, txt) => { const d = document.createElement('div'); d.className = cls; if (st) d.style.cssText = st; if (txt) d.textContent = txt; document.body.appendChild(d); setTimeout(() => d.remove(), 950); };
const ring = () => tmp('ring'), flash = c => tmp('flash', 'background:' + c), big = (t, c) => tmp('big', 'color:' + c, t);
const buzz = n => navigator.vibrate && navigator.vibrate(n);
addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') burst(e.clientX, e.clientY, 1, 1.5); });
let mus = null, step = 0; const NOTES = [262, 330, 392, 523, 392, 330, 392, 494];
function music(on) { clearInterval(mus); mus = null; if (!on) return;
  mus = setInterval(() => { if (muted) return; const n = NOTES[step % 8]; tone(n, .18, 'triangle', .05); if (step % 2 == 0) tone(n / 4, .25, 'sine', .09); if (step % 4 == 0) tone(100, .12, 'sine', .12, 0, 40); step++; }, 230); }
/* screens */
const show = id => { document.querySelectorAll('.scr').forEach(s => s.classList.remove('on')); $('#' + id).classList.add('on'); };

const QS = [
  { q: 'Azərbaycanın paytaxtı hansı şəhərdir?', o: ['Gəncə', 'Bakı', 'Şəki'], a: 1 },
  { q: 'Azərbaycan bayrağında hansı rənglər var?', o: ['Qırmızı, ağ, qara', 'Sarı, mavi, ağ', 'Mavi, qırmızı, yaşıl'], a: 2 },
  { q: 'Xəzər dənizi əslində nədir?', o: ['Dünyanın ən böyük gölü', 'Okeanın qolu', 'Çay'], a: 0 },
  { q: 'Azərbaycanın ən hündür zirvəsi hansıdır?', o: ['Şahdağ', 'Bazardüzü', 'Murovdağ'], a: 1 },
  { q: 'Novruz bayramı hansı fəsildə qeyd olunur?', o: ['Yaz', 'Qış', 'Payız'], a: 0 }
];
let qi = 0, score = 0, streak = 0, timer, left = 1, locked = false;

$('#go').onclick = () => { A(); SFX.tap(); ring(); flash('#1e90ff88'); SFX.whoosh(); show('s1'); let n = 3; $('#cd').textContent = n; SFX.tick();
  const t = setInterval(() => { n--; if (n > 0) { $('#cd').textContent = n; SFX.tick(); ring(); buzz(30); } else { clearInterval(t); SFX.good(); $('#cd').textContent = '🚀'; setTimeout(startQuiz, 600); } }, 800); };

function startQuiz() { music(true); qi = 0; score = 0; streak = 0; $('#sc').textContent = '⭐ 0'; show('s2'); ask(); }
function ask() {
  locked = false; const d = QS[qi]; $('#qn').textContent = (qi + 1) + '/' + QS.length; $('#q').textContent = d.q; $('#combo').textContent = ''; SFX.whoosh(); $('#q').style.animation = 'none'; $('#q').offsetWidth; $('#q').style.animation = '';
  $('#ans').innerHTML = d.o.map((t, i) => `<button class="a c${i}" data-i="${i}"><b>${'ABC'[i]}</b>${t}</button>`).join('');
  document.querySelectorAll('.a').forEach(b => b.onclick = () => pick(+b.dataset.i, b));
  left = 1; clearInterval(timer);
  timer = setInterval(() => { left -= .1 / 10; $('#fill').style.transform = `scaleX(${Math.max(left, 0)})`; if (left < .3) SFX.tick(); if (left <= 0) pick(-1); }, 100);
}
function pick(i, el) {
  if (locked) return; locked = true; clearInterval(timer);
  const d = QS[qi], btns = document.querySelectorAll('.a');
  if (i === d.a) { score += 100 + Math.round(left * 50); streak++; SFX.good(); const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 40, 8);
    big(streak > 1 ? '🔥 ' + streak + 'x KOMBO!' : '✅ ƏLA!', '#7dff8a'); flash('#37c23a66'); ring(); buzz(40); $('#sc').textContent = '⭐ ' + score; }
  else { streak = 0; SFX.bad(); if (el) el.classList.add('no'); big(i < 0 ? '⏰ VAXT!' : '😅 AZ QALDI', '#ff6b6b'); flash('#ef3b3b55'); buzz(200); $('#s2').classList.add('shake'); setTimeout(() => $('#s2').classList.remove('shake'), 500); }
  btns[d.a].classList.add('ok');
  setTimeout(() => { qi++; qi < QS.length ? ask() : result(); }, 1300);
}
function result() {
  show('s3'); music(false); SFX.win(); rain(3500); flash('#ffc92888'); big('🏆', '#ffc928'); const st = score > 600 ? 3 : score > 350 ? 2 : 1; $('#sr').innerHTML = [0, 1, 2].map(i => `<span style="animation-delay:${1.4 + i * .3}s;opacity:${i < st ? 1 : .25}">⭐</span>`).join(''); [0, 1, 2].forEach(i => i < st && setTimeout(() => { SFX.good(); burst(innerWidth / 2 + (i - 1) * 50, 330, 20, 6); }, 1400 + i * 300)); let r = 99; $('#rt').textContent = score + ' xal topladın!';
  const t = setInterval(() => { r = Math.max(1, r - Math.ceil(r / 6)); $('#rank').textContent = '#' + r; SFX.tick();
    if (r === 1) { clearInterval(t); SFX.good(); burst(innerWidth / 2, 160, 70, 9); $('#rt').textContent = '👑 Reytinqdə birinci ol! ' + score + ' xal'; } }, 120);
}
const ps = $('#phone'); $('#pbg').src = $('#poster').src;
ps.addEventListener('pointermove', e => { const b = ps.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5;
  ps.style.transform = `perspective(600px) rotateY(${x * 24}deg) rotateX(${-y * 24}deg)`; });
ps.addEventListener('pointerleave', () => ps.style.transform = '');
$('#play').href = PLAY_URL; $('#play').onclick = () => SFX.tap();
</script>
</body>
